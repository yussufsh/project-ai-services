# Service identification
id: chat
name: "Question and Answer"
description: "Answer questions in natural language by sourcing general & domain-specific knowledge"
version: "1.0.0"
type: service

# Certification and support
certified_by: "IBM"

# Service belongs to these architectures
architectures:
  - rag
  - rag-cpu
  - rag-dev

# Dependencies on other services (version is optional, uses latest if not specified)
dependencies:
  - id: opensearch
    version: ">=1.0.0"
  - id: embedding
    version: ">=1.0.0"
  - id: instruct
    version: ">=1.0.0"
  - id: reranker
    version: ">=1.0.0"

# Outputs/endpoints provided by this service
endpoints:
  - name: ui
    type: http
    port: 3000
    description: "Chat UI"
    health_check: "/"
  
  - name: backend
    type: http
    port: 5000
    description: "Chat API (OpenAI-compatible)"
    health_check: "/health"

