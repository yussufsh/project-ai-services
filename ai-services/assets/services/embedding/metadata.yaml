# Service identification
id: embedding
name: "Embedding"
description: "Text embedding service for document vectorization"
version: "1.0.0"
type: service

# Certification and support
certified_by: "IBM"
dependency_only: true

# Service belongs to these architectures
architectures:
  - rag
  - rag-cpu
  - rag-dev

# Dependencies on other services (version is optional, uses latest if not specified)
dependencies: []

# Outputs/endpoints provided by this service
endpoints:
  - name: vllm
    type: http
    port: 8001
    path: "/v1"
    description: "OpenAI-compatible embedding endpoint"
    health_check: "/health"

