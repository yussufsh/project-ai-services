# Service identification
id: instruct
name: "Instruct"
description: "Language model inference service for instruction-following tasks"
version: "1.0.0"
type: service

# Certification and support
certified_by: "IBM"
dependency_only: true

# Service belongs to these architectures
architectures:
  - rag
  - rag-cpu
  - rag-dev

# Dependencies on other services (version is optional, uses latest if not specified)
dependencies: []

# Outputs/endpoints provided by this service
endpoints:
  - name: vllm
    type: http
    port: 8000
    path: "/v1"
    description: "OpenAI-compatible vLLM inference endpoint"
    health_check: "/health"

