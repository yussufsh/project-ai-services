# Service identification
id: opensearch
name: "OpenSearch"
description: "Vector database for document storage and retrieval"
version: "1.0.0"
type: service

# Certification and support
certified_by: "IBM"
dependency_only: true

# Service belongs to these architectures
architectures:
  - rag
  - rag-cpu
  - rag-dev

# Dependencies on other services (version is optional, uses latest if not specified)
dependencies: []

# Outputs/endpoints provided by this service
endpoints:
  - name: client
    type: http
    port: 9200
    path: "/"
    description: "OpenSearch client API endpoint"
    health_check: "/_cluster/health"
  
  - name: metrics
    type: http
    port: 9600
    path: "/"
    description: "OpenSearch metrics endpoint"

