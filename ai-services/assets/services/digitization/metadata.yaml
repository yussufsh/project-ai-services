# Service identification
id: digitization
name: "Digitize Documents"
description: "Transforms documents such as manuals, invoices, and more into texts"
version: "1.0.0"
type: service

# Certification and support
certified_by: "IBM"

# Service belongs to these architectures
architectures:
  - rag
  - rag-cpu
  - rag-dev

# Dependencies on other services (version is optional, uses latest if not specified)
dependencies:
  - id: opensearch
    version: ">=1.0.0"
  - id: instruct
    version: ">=1.0.0"
  - id: embedding
    version: ">=1.0.0"

# Outputs/endpoints provided by this service
endpoints:
  - name: api
    type: http
    port: 7000
    path: "/digitize"
    description: "Digitization API endpoint"
    health_check: "/health"
  
  - name: ui
    type: http
    port: 7001
    path: "/"
    description: "Digitization UI"
    health_check: "/"

